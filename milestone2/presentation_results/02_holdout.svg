<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600"><rect width="1080" height="600" fill="#faf9f4"/><g font-family="Arial, sans-serif" fill="#172f38"><text x="44" y="54" font-size="32" font-weight="bold">The frozen model did not beat the reference on average precision</text><text x="45" y="90" font-size="20">Matched SVD holdout · 252 sessions · 7 positive recordings from 6 speakers</text><text x="50" y="150" font-size="22" >Model</text><text x="610" y="150" font-size="22" >Average precision</text><text x="925" y="150" font-size="22" >AUROC</text><text x="50" y="202" font-size="22" >Authors’ MLP retrained on SVD</text><text x="670" y="202" font-size="23" >0.084</text><text x="930" y="202" font-size="23" >0.680</text><text x="50" y="251" font-size="22" >Ah alone + SMOTE</text><text x="670" y="251" font-size="23" >0.077</text><text x="930" y="251" font-size="23" >0.766</text><text x="50" y="300" font-size="22" >Three vowels + SMOTE</text><text x="670" y="300" font-size="23" >0.082</text><text x="930" y="300" font-size="23" >0.782</text><text x="50" y="349" font-size="22" >Three vowels + focal loss (frozen)</text><text x="670" y="349" font-size="23" >0.072</text><text x="930" y="349" font-size="23" >0.753</text><rect x="44" y="407" width="990" height="132" rx="10" fill="#e4ede7"/><text x="68" y="453" font-size="25" font-weight="bold">Focal minus reference: -0.012 average precision</text><text x="68" y="501" font-size="23" >Paired 95% speaker-bootstrap interval: -0.141 to +0.110.</text><text x="48" y="577" font-size="17" >Different evaluation protocols prevent a numerical reproduction claim for the published FEMH result.</text></g></svg>
